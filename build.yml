name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q FileCleaner.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          build-root-directory: FileCleaner
      - run: gradle assembleDebug --no-daemon
        working-directory: FileCleaner
      - uses: actions/upload-artifact@v4
        with:
          name: FileCleaner-APK
          path: FileCleaner/app/build/outputs/apk/debug/app-debug.apk
